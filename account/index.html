<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account — YouChill</title>
  <link rel="stylesheet" href="/themes.css">
  <script src="/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <header class="app-header"><a class="logo" href="/">You<span>Chill</span></a>
      <form class="searchbar" role="search" action="/" method="get"><input name="q" type="search" placeholder="Search videos, creators, or tags" aria-label="Search videos"><button type="submit" aria-label="Search">⌕</button></form>
      <div class="header-actions"><a class="btn btn-primary" href="/upload">＋ Upload</a><a data-signin href="/signin">Sign in</a><a data-account class="hidden" href="/account"></a></div>
    </header>
    <div class="page-layout">
      <aside class="sidebar"><a href="/">⌂ Home</a><a href="/channels">▣ Channels</a><a href="/chat">☵ Community</a><a href="/upload">＋ Create</a></aside>
      <main class="content">
        <div id="accountRoot"><p class="notice">Loading your account…</p></div>
      </main>
    </div>
    <footer class="footer">YouChill is a small video community · <a href="/channels">Explore channels</a> · <a href="/chat">Join the conversation</a></footer>
  </div>

  <script>
    const root = document.getElementById('accountRoot');

    function render(user, videos) {
      const heading = document.createElement('h1');
      heading.className = 'page-title';
      heading.textContent = user.username;

      const joined = new Date(user.createdAt);
      const meta = document.createElement('p');
      meta.className = 'watch-meta';
      meta.textContent = `Joined ${joined.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })} · ${videos.length} video${videos.length === 1 ? '' : 's'}`;

      const actions = document.createElement('div');
      actions.className = 'watch-actions';
      const upload = document.createElement('a');
      upload.className = 'btn btn-primary';
      upload.href = '/upload';
      upload.textContent = '＋ Upload a video';
      const signOut = document.createElement('button');
      signOut.type = 'button';
      signOut.className = 'btn btn-ghost';
      signOut.textContent = 'Sign out';
      signOut.addEventListener('click', async () => {
        signOut.disabled = true;
        try {
          await Api.post('/api/signout');
        } finally {
          location.assign('/');
        }
      });
      actions.append(upload, signOut);

      const sectionTitle = document.createElement('h2');
      sectionTitle.className = 'comments-title';
      sectionTitle.textContent = 'Your videos';

      const grid = document.createElement('div');
      grid.className = 'video-grid';

      if (videos.length) {
        grid.replaceChildren(...videos.map(videoCard));
      } else {
        const blank = document.createElement('p');
        blank.className = 'empty';
        blank.append('You have not uploaded anything yet. ');
        const link = document.createElement('a');
        link.href = '/upload';
        link.textContent = 'Upload your first video';
        blank.append(link, document.createTextNode('.'));
        grid.appendChild(blank);
      }

      root.replaceChildren(heading, meta, actions, sectionTitle, grid);
    }

    (async function boot() {
      const user = await getMe();
      if (!user) {
        location.assign(signInUrl());
        return;
      }
      const data = await Api.get('/api/videos').catch(() => ({ videos: [] }));
      render(user, data.videos.filter(video => video.creator === user.username));
    })();
  </script>
</body>

</html>
