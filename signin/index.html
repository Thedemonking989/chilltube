<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — YouChill</title>
  <link rel="stylesheet" href="/themes.css">
  <script src="/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <header class="app-header"><a class="logo" href="/">You<span>Chill</span></a>
      <form class="searchbar" role="search" action="/" method="get"><input name="q" type="search" placeholder="Search videos, creators, or tags" aria-label="Search videos"><button type="submit" aria-label="Search">⌕</button></form>
      <div class="header-actions"><a class="btn btn-primary" href="/upload">＋ Upload</a><a data-signin href="/signin">Sign in</a><a data-account class="hidden" href="/account"></a></div>
    </header>
    <div class="page-layout">
      <aside class="sidebar"><a href="/">⌂ Home</a><a href="/channels">▣ Channels</a><a href="/chat">☵ Community</a><a href="/upload">＋ Create</a></aside>
      <main class="content">
        <form id="authForm" class="panel form-panel" autocomplete="off">
          <div class="tabs">
            <button type="button" class="tab active" data-mode="signin">Sign in</button>
            <button type="button" class="tab" data-mode="signup">Create account</button>
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" maxlength="20" autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
          </div>
          <p class="field-hint" id="hint">Usernames are 3–20 letters, numbers, dashes or underscores · passwords need 6+ characters.</p>
          <button class="btn btn-primary" id="submitBtn" type="submit">Sign in</button>
          <p id="status" class="notice"></p>
        </form>
      </main>
    </div>
    <footer class="footer">YouChill is a small video community · <a href="/channels">Explore channels</a> · <a href="/chat">Join the conversation</a></footer>
  </div>

  <script>
    const form = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const tabs = [...document.querySelectorAll('.tab')];
    let mode = 'signin';

    function setMode(next) {
      mode = next;
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
      submitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
      document.getElementById('password').autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
      status.textContent = '';
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        status.textContent = 'Fill in a username and password.';
        return;
      }

      submitBtn.disabled = true;
      try {
        await Api.post(mode === 'signin' ? '/api/signin' : '/api/signup', { username, password });
        const next = new URLSearchParams(location.search).get('next');
        location.assign(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
      } catch (error) {
        status.textContent = error.message;
        submitBtn.disabled = false;
      }
    });

    (async function boot() {
      const user = await getMe();
      if (!user) return;
      status.append(`You are signed in as ${user.username}. `);
      const leave = document.createElement('a');
      leave.href = '/account';
      leave.textContent = 'Go to your account';
      status.appendChild(leave);
    })();
  </script>
</body>

</html>
