<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouChill browser checks</title>
  <link rel="stylesheet" href="/themes.css">
  <script src="/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <header class="app-header"><a class="logo" href="/">You<span>Chill</span></a>
      <form class="searchbar" role="search" action="/" method="get"><input name="q" type="search" placeholder="Search videos, creators, or tags" aria-label="Search videos"><button type="submit" aria-label="Search">⌕</button></form>
      <div class="header-actions"><a class="btn btn-primary" href="/upload">＋ Upload</a><a data-signin href="/signin">Sign in</a><a data-account class="hidden" href="/account"></a></div>
    </header>
    <main class="content">
      <section class="panel form-panel">
        <h1 class="page-title">YouChill self-checks</h1>
        <p class="notice">These run in your browser against the running server.</p>
        <ol id="results" class="check-list"></ol>
      </section>
    </main>
  </div>

  <script>
    const results = document.getElementById('results');
    const checks = [
      ['video feed responds from the server', async () => Array.isArray((await Api.get('/api/videos')).videos)],
      ['demo feed has sample cards', () => DEMO_VIDEOS.length >= 6],
      ['view counts are formatted for people', () => formatCount(1200000) === '1.2M'],
      ['chat history is readable', async () => Array.isArray((await Api.get('/api/chat')).messages)],
      ['sign-in state is reported', async () => 'user' in await Api.get('/api/me')],
      ['watch links point at clean routes', () => watchUrl('abc').startsWith('/watch?id=')]
    ];

    (async function run() {
      for (const [name, test] of checks) {
        const item = document.createElement('li');
        try {
          item.textContent = `${(await test()) ? 'PASS' : 'FAIL'} — ${name}`;
        } catch (error) {
          item.textContent = `FAIL — ${name}: ${error.message}`;
        }
        results.appendChild(item);
      }
    })();
  </script>
</body>

</html>
