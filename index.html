<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouChill — Watch and share</title>
  <link rel="stylesheet" href="/themes.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <header class="app-header"><a class="logo" href="/">You<span>Chill</span></a>
      <form id="searchForm" class="searchbar" role="search" action="/" method="get"><input id="searchInput" name="q" type="search" placeholder="Search videos, creators, or tags" aria-label="Search videos"><button type="submit" aria-label="Search">⌕</button></form>
      <div class="header-actions"><a class="btn btn-primary" href="/upload">＋ Upload</a><a data-signin href="/signin">Sign in</a><a data-account class="hidden" href="/account"></a></div>
    </header>
    <div class="page-layout">
      <aside class="sidebar"><a class="active" href="/">⌂ Home</a><a href="/channels">▣ Channels</a><a href="/chat">☵ Community</a><a href="/upload">＋ Create</a></aside>
      <main class="content">
        <div id="chips" class="chip-row"></div>
        <section>
          <h1 class="mb-5 text-2xl font-bold">Recommended videos</h1>
          <div id="videoGrid" class="video-grid"></div>
          <p id="empty" class="empty hidden">No videos match your search.</p>
          <p id="feedStatus" class="notice"></p>
        </section>
      </main>
    </div>
    <footer class="footer">YouChill is a small video community · <a href="/channels">Explore channels</a> · <a href="/chat">Join the conversation</a></footer>
  </div>
  <script>
    const grid = document.getElementById('videoGrid');
    const empty = document.getElementById('empty');
    const status = document.getElementById('feedStatus');
    const searchInput = document.getElementById('searchInput');
    const searchForm = document.getElementById('searchForm');
    const categories = ['All', 'Trending', 'Music', 'Gaming', 'Learning', 'Live', 'Comedy'];
    let activeCategory = 'All';
    let renderId = 0;

    function renderChips() {
      const holder = document.getElementById('chips');
      holder.replaceChildren();
      categories.forEach(category => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `chip ${category === activeCategory ? 'active' : ''}`;
        button.textContent = category;
        button.onclick = () => {
          activeCategory = category;
          renderChips();
          render(searchInput.value.trim().toLowerCase());
        };
        holder.appendChild(button);
      });
    }

    function matches(video, term) {
      if (term && !`${video.title} ${video.creator} ${video.tags || ''}`.toLowerCase().includes(term)) return false;
      if (activeCategory === 'All') return true;
      if (activeCategory === 'Trending') return Number(video.views) > 0;
      return video.category === activeCategory;
    }

    async function render(term = '') {
      const current = ++renderId;
      status.textContent = 'Loading videos…';
      const videos = await allVideos();
      if (current !== renderId) return;
      const found = videos.filter(video => matches(video, term));
      grid.replaceChildren(...found.map(videoCard));
      empty.classList.toggle('hidden', found.length > 0);
      status.textContent = found.length ? '' : 'Nothing here yet — try another search.';
    }

    function applySearch(value, push) {
      const term = value.trim();
      const url = term ? `/?q=${encodeURIComponent(term)}` : '/';
      if (push) history.pushState(null, '', url);
      else history.replaceState(null, '', url);
      render(term.toLowerCase());
    }

    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      applySearch(searchInput.value, true);
    });
    searchInput.addEventListener('input', () => applySearch(searchInput.value, false));

    const initialTerm = new URLSearchParams(location.search).get('q') || '';
    searchInput.value = initialTerm;
    renderChips();
    render(initialTerm.trim().toLowerCase());
  </script>
</body>

</html>
